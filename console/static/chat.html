<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对话 · HarnessGrad 实验台</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<style>
  .chat2 { display: grid; grid-template-columns: 240px minmax(0,1fr); min-height: 0; flex: 1; }
  .sess2 { border-right: 1px solid var(--hg-alias-border-l2); overflow: auto; padding: 8px; }
  .sess2 .s { display: block; width: 100%; text-align: left; padding: 7px 9px; border-radius: 7px;
              font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess2 .s:hover { background: var(--hg-alias-bg-layer-2); }
  .sess2 .s[aria-current="true"] { background: var(--hg-alias-bg-layer-2); font-weight: 600; }
  .stream2 { overflow: auto; }
  .inner2 { max-width: 820px; margin: 0 auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .skill2 { border: 1px solid var(--hg-alias-border-l2); border-radius: 10px; background: var(--hg-alias-bg-layer-1); }
  .skill2 h4 { margin: 0; padding: 9px 11px; border-bottom: 1px dashed var(--hg-alias-border-l2); font-size: 12.5px; }
  .rows2 { padding: 10px 11px; display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 7px 10px; align-items: center; }
  .rows2 label { color: var(--hg-alias-label-secondary); font-size: 11.5px; }
  .rows2 select, .rows2 input { font: inherit; font-size: 11.5px; padding: 4px 8px; border-radius: 7px;
      border: 1px solid var(--hg-alias-border-l2); background: var(--hg-alias-bg-layer-1); color: inherit; }
  .cmd2 { margin: 0; padding: 9px 11px; border-top: 1px dashed var(--hg-alias-border-l2);
          font-family: ui-monospace, Menlo, monospace; font-size: 11px; white-space: pre-wrap;
          overflow-wrap: anywhere; color: var(--hg-alias-label-secondary); }
  .foot2 { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-top: 1px solid var(--hg-alias-border-l2);
           background: var(--hg-alias-bg-layer-2); }
  .blocked { color: #b4402f; font-size: 11.5px; }
  .ok2 { color: #2f7a4f; font-size: 11.5px; }
  .note2 { font-size: 11px; color: var(--hg-alias-label-secondary); padding: 0 11px 10px; }
  .composer2 { padding: 10px 18px 16px; }
  .composer2 .box { max-width: 820px; margin: 0 auto; border: 1px solid var(--hg-alias-border-l2);
      border-radius: 12px; background: var(--hg-alias-bg-layer-1); padding: 10px 11px; display: flex; flex-direction: column; gap: 8px; }
  .composer2 textarea { width: 100%; min-height: 44px; border: 0; background: transparent; color: inherit; font: inherit; outline: none; resize: none; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">HG</div>
      <div><div class="brand-name">HarnessGrad</div><div class="brand-sub">实验台</div></div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="/" >实验 <span class="nav-badge" id="n2">—</span></a>
      <a class="nav-item" href="/#/trace">轨迹</a>
      <a class="nav-item" href="/#/version">版本</a>
    </nav>
    <div class="nav-group">
      <div class="nav-group-label">会话</div>
      <div class="sess2" id="sessions"></div>
    </div>
    <div class="side-foot">
      <div class="status-line" id="st2"><span class="status-dot"></span>读取中…</div>
      <div class="status-line" id="st3"></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>对话</h1>
      <span class="sub">只做一件事：把一句话变成一次可确认的运行</span>
      <span class="spacer"></span>
      <button class="btn" data-variant="primary" id="add-skill">⚡ 跑实验</button>
    </div>
    <div class="chat2">
      <div class="sess2" id="list"></div>
      <div class="stream2"><div class="inner2" id="stream"></div></div>
    </div>
    <div class="composer2">
      <div class="box">
        <textarea id="say" placeholder="例如：在 appworld 上跑 3 轮，并发 8"></textarea>
        <div class="composer-bar">
          <span class="hint">这一版对话不接模型：卡片是确定性的表单，起跑由平台执行</span>
          <button class="btn" id="send">发送</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/chat.js"></script>
</body>
</html>
